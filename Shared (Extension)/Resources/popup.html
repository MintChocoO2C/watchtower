<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
    <div class="header">
        <img class="header-icon" src="images/icon-48.png" alt="">
        <div class="header-text">
            <h1>Watchtower</h1>
            <span class="header-sub" data-i18n="extension_description">Safari Extension</span>
        </div>
    </div>

    <div class="section">
        <div class="section-header" data-i18n="sectionVideo">Video</div>
        <div class="feature-row">
            <div class="feature-info">
                <span class="feature-label" data-i18n="autoPipLabel">Auto PiP</span>
                <span class="feature-desc" data-i18n="autoPipDesc">Auto PiP on tab switch</span>
            </div>
            <label class="toggle">
                <input type="checkbox" id="auto-pip-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="feature-divider"></div>
        <div class="feature-row">
            <div class="feature-info">
                <span class="feature-label" data-i18n="pressFastForwardLabel">Press to Fast-Forward</span>
                <span class="feature-desc" data-i18n="pressFastForwardDesc">Hold on a video for 2× speed</span>
            </div>
            <label class="toggle">
                <input type="checkbox" id="press-ff-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <div class="section">
        <div class="section-header" data-i18n="sectionYouTube">YouTube</div>
        <div class="feature-row">
            <div class="feature-info">
                <span class="feature-label" data-i18n="ytMiniplayerLabel">YouTube Miniplayer</span>
                <span class="feature-desc" data-i18n="ytMiniplayerDesc">Switch to miniplayer on logo click</span>
            </div>
            <label class="toggle">
                <input type="checkbox" id="yt-logo-miniplayer-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="feature-divider"></div>
        <div class="feature-row">
            <div class="feature-info">
                <span class="feature-label" data-i18n="hideShortsLabel">Hide Shorts</span>
                <span class="feature-desc" data-i18n="hideShortsDesc">Remove Shorts from home feed</span>
            </div>
            <label class="toggle">
                <input type="checkbox" id="yt-hide-shorts-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <div class="section section-dev">
        <div class="section-header" data-i18n="sectionDeveloper">Developer</div>
        <div class="feature-row">
            <div class="feature-info">
                <span class="feature-label" data-i18n="debugLabel">Debug</span>
                <span class="feature-desc" data-i18n="debugDesc">Print [WT] logs to console</span>
            </div>
            <label class="toggle">
                <input type="checkbox" id="debug-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <div id="status" class="status"></div>
</body>
</html>
